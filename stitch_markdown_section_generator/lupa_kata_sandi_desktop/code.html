<style>

            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-md font-body-md antialiased relative overflow-hidden">
<!-- Decorative subtle background elements -->
<div class="absolute top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-primary-fixed opacity-[0.15] blur-3xl"></div>
<div class="absolute top-[60%] -right-[10%] w-[40vw] h-[40vw] rounded-full bg-secondary-fixed opacity-[0.15] blur-3xl"></div>
</div>
<main class="w-full max-w-md px-container-margin z-10 animate-fade-in">
<!-- Logo / Brand Area -->
<div class="text-center mb-section-gap">
<h1 class="font-headline-lg text-headline-lg text-kemenkes-blue flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[32px]">health_and_safety</span>
                Layanan Kesehatan Jiwa
            </h1>
</div>
<!-- Reset Password Card -->
<div class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-[0_4px_24px_rgba(0,0,0,0.02)] p-8">
<div class="text-center mb-stack-lg">
<div class="w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center mx-auto mb-stack-md">
<span class="material-symbols-outlined text-primary text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Lupa Kata Sandi</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Masukkan alamat email yang terdaftar. Kami akan mengirimkan tautan untuk mengatur ulang kata sandi Anda.
                </p>
</div>
<form action="#" class="space-y-stack-lg" method="POST">
<!-- Email Input -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface block" for="email">
                        Alamat Email
                    </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface placeholder-on-surface-variant/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-md text-body-md" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<!-- Submit Action -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-on-primary bg-primary hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all font-label-md text-label-md active:scale-[0.98]" type="submit">
                        Kirim Tautan Reset
                    </button>
</div>
</form>
</div>
<!-- Return to Login Link -->
<div class="mt-stack-lg text-center">
<a class="inline-flex items-center gap-2 font-label-md text-label-md text-primary hover:text-primary-container transition-colors p-2 rounded-lg hover:bg-surface-container-low" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                Kembali ke Halaman Masuk
            </a>
</div>
</main>
<script>
        // Simple client-side validation logic placeholder
        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const btn = this.querySelector('button[type="submit"]');
            
            if(email) {
                // Simulate loading state
                const originalText = btn.innerHTML;
                btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                btn.disabled = true;
                btn.classList.add('opacity-80');
                
                setTimeout(() => {
                    // Reset form and show success state (ideally a toast or redirect)
                    btn.innerHTML = '<span class="material-symbols-outlined mr-2">check_circle</span> Tautan Terkirim';
                    btn.classList.remove('bg-primary');
                    btn.classList.add('bg-status-success', 'text-on-primary');
                    
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        btn.classList.remove('opacity-80', 'bg-status-success');
                        btn.classList.add('bg-primary');
                        this.reset();
                    }, 3000);
                }, 1500);
            }
        });
    </script>
