<body class="bg-surface min-h-screen flex items-center justify-center p-container-margin relative overflow-hidden">
<!-- Subtle Background Decoration -->
<div class="absolute top-0 left-0 w-full h-full pointer-events-none z-0 opacity-40">
<div class="absolute -top-40 -left-40 w-96 h-96 bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-50"></div>
<div class="absolute top-1/2 right-0 w-80 h-80 bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
</div>
<!-- Centered Login Card -->
<main class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-section-gap z-10 flex flex-col gap-stack-lg relative">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center mb-stack-sm border border-outline-variant">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Masuk ke Akun</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Layanan Kesehatan Jiwa Kemenkes RI</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="email">Alamat Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all" id="email" placeholder="contoh@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-md text-label-md text-on-surface" for="password">Kata Sandi</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface border border-outline rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-all" id="password" placeholder="Masukkan kata sandi Anda" required="" type="password"/>
<button aria-label="Tampilkan kata sandi" class="absolute right-3 p-1 rounded hover:bg-surface-container transition-colors text-outline focus:outline-none focus:ring-2 focus:ring-primary" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="toggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline" href="#">
                    Lupa kata sandi?
                </a>
</div>
<!-- Submit Button -->
<button class="w-full py-3 mt-stack-sm bg-primary text-on-primary rounded-full font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-primary-container hover:text-on-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all active:scale-[0.98]" type="submit">
                Masuk
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative flex items-center py-stack-sm">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-caption text-caption text-outline">Atau</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Footer Link -->
<div class="text-center font-body-md text-body-md text-on-surface-variant">
            Belum punya akun? 
            <a class="font-semibold text-primary hover:text-primary-container transition-colors focus:outline-none focus:underline" href="#">
                Daftar sekarang
            </a>
</div>
</main>
<!-- Inline Script for Password Toggle -->
<script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            togglePasswordBtn.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle the icon text (Material Symbols Outlined)
                toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
                
                // Update aria-label for accessibility
                const label = type === 'password' ? 'Tampilkan kata sandi' : 'Sembunyikan kata sandi';
                togglePasswordBtn.setAttribute('aria-label', label);
            });
        });
    </script>
</body></html>
