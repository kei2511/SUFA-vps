<body class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-background">

<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">psychology</span>
<span class="font-headline-md text-headline-md font-bold text-primary">Layanan Kesehatan Jiwa</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-container-margin pt-24">
<!-- Centered Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant/30 shadow-[0_4px_12px_rgba(0,0,0,0.02)] p-section-gap flex flex-col gap-stack-lg">
<!-- Header Section -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container mb-2">
<span class="material-symbols-outlined text-3xl">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Atur Kata Sandi Baru</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Silakan masukkan kata sandi baru Anda. Pastikan kata sandi kuat dan mudah diingat.
                </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-md w-full">
<!-- Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="new_password">Kata Sandi Baru</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline/70" id="new_password" name="new_password" placeholder="Masukkan kata sandi baru" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<p class="font-caption text-caption text-on-surface-variant mt-1">Minimal 8 karakter, kombinasi huruf dan angka.</p>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Konfirmasi Kata Sandi Baru</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-outline bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors font-body-md text-body-md text-on-surface placeholder:text-outline/70" id="confirm_password" name="confirm_password" placeholder="Ketik ulang kata sandi baru" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-12 mt-4 bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center hover:bg-primary/90 transition-colors active:scale-[0.98]" type="submit">
                    Simpan Kata Sandi Baru
                </button>
<!-- Back Link -->
<div class="text-center mt-2">
<a class="font-label-md text-label-md text-primary hover:text-primary/80 transition-colors inline-flex items-center gap-1 justify-center" href="#">
<span class="material-symbols-outlined text-sm">arrow_back</span>
                        Kembali ke Masuk
                    </a>
</div>
</form>
